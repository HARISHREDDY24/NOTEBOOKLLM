<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NotebookLM Clone</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <h1>NotebookLM Clone</h1>





        <!-- Upload Section -->

        <div class="card">

            <h2>Upload PDF</h2>

            <input type="file" id="pdfFile" />

            <button onclick="uploadPDF()">
                Upload PDF
            </button>

            <p id="uploadStatus"></p>

        </div>





        <!-- Ask Question -->

        <div class="card">

            <h2>Ask Question</h2>

            <textarea id="question" placeholder="Ask anything about the uploaded document..."></textarea>

            <button onclick="askQuestion()">
                Ask
            </button>

            <div id="answer"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
